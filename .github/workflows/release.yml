name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/build_frontend.sh
      - name: Package integration
        run: |
          cd custom_components/family_organizer
          zip -r ../../family_organizer.zip . -x '__pycache__/*' '*.pyc'
      - run: gh release create "$GITHUB_REF_NAME" family_organizer.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
